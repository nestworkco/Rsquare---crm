name: CI/CD — Rsquare CRM

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── JOB 1: Chạy test trước ──────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run auth tests
        run: node auth.test.js

  # ─── JOB 2: Validate code ────────────────────────────────────────
  validate:
    name: Validate Code
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const matches = html.match(/<script[^>]*>([\s\S]*?)<\/script>/gi) || [];
            const js = matches.filter(s => !s.includes('src=')).map(s => s.replace(/<script[^>]*>/i,'').replace(/<\/script>/i,'')).join('\n');
            fs.writeFileSync('/tmp/check.js', js);
          "
          node --check /tmp/check.js
          echo "✅ JS syntax OK"

      - name: Check critical functions exist
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const required = ['function doLogin','function doLogout','function loadData','function saveRecord','function delRecord','function applyFilters','function renderDashboard','function exportXLSX','function bulkApplyStatus'];
            let allOk = true;
            required.forEach(fn => {
              if (html.includes(fn)) console.log('  ✅ ' + fn);
              else { console.error('  ❌ MISSING: ' + fn); allOk = false; }
            });
            if (!allOk) process.exit(1);
          "

      - name: Check file size
        run: |
          SIZE=$(wc -c < index.html)
          if [ "$SIZE" -lt 50000 ]; then echo "❌ File too small"; exit 1; fi
          echo "✅ File size OK ($SIZE bytes)"

  # ─── JOB 3: Deploy (chỉ sau khi test + validate đều pass) ────────
  deploy:
    name: Deploy to GitHub Pages
    needs: [test, validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
